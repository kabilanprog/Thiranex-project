<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enroll | Online Course Enrollment System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="enroll">
  <header class="app-header" id="app-header"></header>
  <main class="page">
    <div class="card-box enroll-card">
      <h2>Enroll into a Course</h2>
      <div id="msg" class="alert-box"></div>
      <div class="info-bar" id="info-bar">Loading...</div>

      <form id="enroll-form" novalidate>
        <div class="form-group">
          <label for="student-name">Student Name</label>
          <input class="form-control" type="text" id="student-name" readonly>
        </div>
        <div class="form-group">
          <label for="course-select">Select Course</label>
          <select class="form-control" id="course-select"></select>
        </div>
        <div class="form-group">
          <label for="batch-select">Preferred Batch</label>
          <select class="form-control" id="batch-select">
            <option>Morning Batch (10 AM - 12 PM)</option>
            <option>Afternoon Batch (2 PM - 4 PM)</option>
            <option>Evening Batch (6 PM - 8 PM)</option>
          </select>
        </div>
        <button class="btn" type="submit" id="enroll-btn">Confirm Enrollment</button>
      </form>
    </div>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
