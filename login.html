<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Online Course Enrollment System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">
  <header class="app-header">
    <span class="brand">Online Course Enrollment System</span>
    <span class="header-note">Mini LMS</span>
  </header>

  <main class="auth-wrap">
    <div class="card-box auth-card">
      <h1 id="auth-title">Welcome Back</h1>
      <p class="subtitle" id="auth-subtitle">Sign in to your student account</p>

      <div id="msg" class="alert-box"></div>

      <form id="auth-form" novalidate>
        <div class="form-group" id="name-group" style="display:none">
          <label for="name">Full Name</label>
          <input class="form-control" type="text" id="name" autocomplete="name">
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input class="form-control" type="email" id="email" placeholder="you@student.edu" autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input class="form-control" type="password" id="password" autocomplete="current-password">
        </div>
        <button class="btn btn-block" type="submit" id="auth-submit">Log In</button>
      </form>

      <p class="switch" id="auth-switch"></p>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
